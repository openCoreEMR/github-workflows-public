# OpenTofu checks (reusable workflow): conflict markers, fmt, init, validate, test.
#
# Recommended caller stanza. Do not add `paths:` to `pull_request`; it
# breaks promotion to a required check (skipped run = missing check =
# auto-merge stall). Path filtering on `push` is fine.
#
#   name: opentofu
#   on:
#     push:
#       branches: [main]
#       paths:
#         - '**/*.tf'
#         - '**/*.tfvars'
#         - '**/*.tftest.hcl'
#         - '**/*.tfmock.hcl'
#         - '**/.terraform.lock.hcl'
#         - .github/workflows/opentofu.yml
#     pull_request:
#       branches: [main]
#   jobs:
#     opentofu:
#       uses: openCoreEMR/github-workflows-public/.github/workflows/opentofu.yml@<tag>
#       permissions:
#         contents: read
#       # with:
#       #   tofu-version: ~1.10.0
#       #   working-directory: .
#
# `tofu-version` is a setup-opentofu version or semver range. The default,
# `~1.10.0`, matches modules that pin `required_version = "~> 1.10.0"`;
# override it when a module's constraint moves.
#
# `tofu init` downloads modules even with `-backend=false`, and this workflow
# has no SSH key or token input, so for now module sources must be fetchable
# without credentials (public registry or `https://` sources, not private
# `git@github.com:` ones).
#
# The conflict-marker step scans every tracked file in the repo, not just
# `working-directory`: `tofu fmt` only notices markers in OpenTofu files, so a
# conflicted `.gitignore` or workflow would otherwise pass.
name: OpenTofu (reusable)

on:
  workflow_call:
    inputs:
      tofu-version:
        description: OpenTofu version or semver range (setup-opentofu syntax)
        type: string
        default: ~1.10.0
      working-directory:
        description: Directory containing the OpenTofu module, relative to the repo root
        type: string
        default: .
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest

jobs:
  opentofu:
    name: Check OpenTofu module
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Repo-wide on purpose, so it overrides the working-directory default.
      # Markers are anchored at line start in their exact 7-character forms
      # (`<<<<<<<` and `>>>>>>>` followed by a space or end of line, `=======`
      # alone on its line, plus the diff3 `|||||||` base marker), so ordinary
      # content such as `=====` rulers or `<<<<<<<<` does not match. Known false
      # positive: a line of exactly `=======` (e.g. a setext Markdown heading
      # underline below a 7-character title) fails the check.
      - name: Check for merge conflict markers
        working-directory: ${{ github.workspace }}
        run: |
          status=0
          matches=$(git grep -n -I -E \
            -e '^(<{7}|>{7}|[|]{7})([[:space:]]|$)' \
            -e '^={7}[[:space:]]*$') || status=$?
          if [ "$status" -eq 0 ]; then
            printf '%s\n' "$matches" | sed 's/^/found at /'
            echo '::error title=Merge conflict markers::Tracked files contain unresolved merge conflict markers (listed above as file:line). Resolve them and push again.'
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::git grep failed with exit status $status"
            exit "$status"
          fi
          echo 'No merge conflict markers found in tracked files.'

      # `tofu init`, `validate` and `test` all exit 0 in a directory with no
      # configuration, so a wrong `working-directory` would otherwise pass
      # while checking nothing. Static message: it never echoes the input.
      - name: Check for OpenTofu files
        run: |
          if [ -z "$(find . -maxdepth 1 -type f \( -name '*.tf' -o -name '*.tofu' -o -name '*.tf.json' -o -name '*.tofu.json' \) -print -quit)" ]; then
            echo '::error title=No OpenTofu files::working-directory contains no .tf, .tofu, .tf.json or .tofu.json file, so there is nothing to check. Point working-directory at the module root.'
            exit 1
          fi

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ inputs.tofu-version }}
          # The wrapper re-routes tofu's stdout/stderr through the action's
          # outputs; the plain binary is what these run steps want.
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive

      - name: tofu init
        run: tofu init -backend=false

      - name: tofu validate
        run: tofu validate

      - name: tofu test
        run: tofu test
