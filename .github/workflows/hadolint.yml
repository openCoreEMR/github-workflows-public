# hadolint (Dockerfile linter) reusable workflow.
#
# Recommended caller stanza. Do not add `paths:` to `pull_request`; it
# breaks promotion to a required check (skipped run = missing check =
# auto-merge stall). Path filtering on `push` is fine.
#
#   name: hadolint
#   on:
#     push:
#       branches: [main]
#       paths:
#         - '**/Dockerfile*'
#         - .github/workflows/hadolint.yml
#     pull_request:
#       branches: [main]
#   jobs:
#     hadolint:
#       uses: openCoreEMR/github-workflows-public/.github/workflows/hadolint.yml@<tag>
#       permissions:
#         contents: read
name: hadolint (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest

jobs:
  hadolint:
    name: Lint Dockerfiles
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    # Install the hadolint binary from its GitHub release. Pulling the
    # hadolint/hadolint image from Docker Hub anonymously gets 429s on
    # shared runners.
    env:
      HADOLINT_VERSION: v2.15.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install hadolint
        run: |
          case "$(uname -m)" in
            x86_64) asset=hadolint-linux-x86_64 sha=c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507 ;;
            aarch64) asset=hadolint-linux-arm64 sha=f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d ;;
            *) printf 'Unsupported runner architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/hadolint" "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/${asset}"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/bin/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run hadolint
        run: |
          git ls-files -z 'Dockerfile*' \
                          '**/Dockerfile*' |
          xargs --null --no-run-if-empty hadolint
